# 单位为区块。每次只处理一个快照。达到预算仍有缺项则停下并保留数据。
initial-radius: 128
ring-step: 32
max-radius: 256
ticks-between-chunks: 2
# 原型门槛，单位为实际方块数。由独立区块快照统计。
minimum-blocks:
  iron: 4096
  copper: 2048
  gold: 512

freight:
  pause-when-empty: true

# 直辖税仓到本领驻地的曼哈顿区块距离，每步所含的区块数。改值从下一税期生效。
realm:
  chunks-per-tax-step: 1

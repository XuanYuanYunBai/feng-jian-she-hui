name: FeudalSurvey
main: social.feudal.survey.SurveyPlugin
version: '0.13.0'
api-version: '26.3'
description: 封建社会 · 领地、封契与实物税
softdepend: [BlueMap]
commands:
  realm:
    description: 帝国疆域、税仓与授职
    usage: /realm help
  survey:
    description: 查看主世界勘测进度，启动、暂停或继续勘测
    usage: /survey <start|status|pause|resume>
    permission: feudal.survey.admin
  freight:
    description: 公共货线装货、运输与签收
    usage: /freight routes | route|sail 名称 起X 起Y 起Z 终X 终Y 终Z | send 货线 运单号 [收货人] | status [运单号] | accept 运单号
    permission: feudal.freight.use
permissions:
  feudal.realm.admin:
    default: op
  feudal.freight.use:
    default: true
  feudal.freight.admin:
    default: op
  feudal.survey.admin:
    description: 管理开服勘测与查看矿产统计
    default: op
